    convex: [convex/progression.ts, convex/plan.ts]
    paths:
      - src/components/progression/**
      - src/hooks/use-progression.ts
      - convex/lib/badges.ts
      - convex/lib/coverage.ts
    personas: [escoteiro-with-progression, escoteiro-approved, escoteiro-lobinho, sim-troop-senior-9]
    specs:
      - tests/e2e/readonly/r2-escoteiro-dashboard.spec.ts
      - tests/e2e/readonly/r2-approved-locked.spec.ts
      - tests/e2e/readonly/r2-escoteiro-tab-bar.spec.ts
      - tests/e2e/mutating/m01-mark-unmark.spec.ts
      - tests/e2e/mutating-mobile/m01-mark-unmark.mobile.spec.ts
      - tests/e2e/mutating/m05-acao-personalizada.spec.ts
      - tests/e2e/mutating/m09-irr-completion.spec.ts
    adjacent: [plan, especialidades, approvals-queue, revisao-rapida]
    check: |
      Sign in 9900006 → stage banner + overall progress render; expand a bloco
      in an eixo, approved ações show locked (can't uncheck). Mark an unchecked
      ação → it shows pending; unmark it. Bottom tab bar: Progressão / Plano /
      Especialidades / Perfil. Repeat the read on a lobinho (9900007) — labels
      differ per ramo. Desktop + mobile (390px) viewport.

  - id: plan
    name: Plano (estrelas, Por Área / lista, reordenar)
    routes:
      /plan: src/routes/plan.tsx
    convex: [convex/plan.ts, convex/progression.ts, convex/specialties.ts]
    paths:
