      - tests/e2e/readonly/r3-plan-por-area.spec.ts
      - tests/e2e/mutating/m06-plan-lifecycle.spec.ts
      - tests/e2e/mutating-mobile/m06-plan-lifecycle.mobile.spec.ts
      - tests/e2e/mutating/m22-plan-especialidade.spec.ts
    adjacent: [escoteiro-progression, especialidades, revisao-rapida, stats]
    check: |
      9900005 (empty plan) → /plan shows "Seu plano está vazio". 9900006 (one
      seeded star, Aprendizagem contínua) → starred item renders in both views
      (toggle "Por Área" / "Minha Ordem"). Star an ação on the home view →
      appears on /plan; unstar → gone. Reorder by drag ("Arrastar" handle in
      Minha Ordem) on a PR preview only, as an m06-owned persona (Íris Campos
      9921009).

