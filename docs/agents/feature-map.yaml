    check: |
      Escoteiro (9900005) → Perfil tab: "Seu nome", "Seu papel" (Escoteiro),
      "Grupo" card "__TEST__ Grupo QA 99999/RS" + password TESTQA, no
      "Gerenciar grupo"/"Seções". Admin → Mais → Ajustes (page titled
      "Configurações"): "Gerenciar grupo" (Nome do grupo, Região escoteira
      (UF), "Excluir grupo" — never click) + "Seções". "Sair do grupo" is
      hidden for contas gerenciadas, so no test persona can see it. Rename on
      a PR preview as m14's Gael Monteiro (9911007) → "Salvar nome" →
      "Salvo." → persists on reload; restore it.

  - id: secoes
    name: Seções (criar/renomear/remover, alocar escoteiro, seção observada)
    routes:
      /settings: src/routes/settings.tsx # create/rename/remove
      /escotista/admin: src/routes/escotista/admin.tsx # place an escoteiro (SectionPicker)
      /escotista: src/routes/escotista/index.tsx # observed-seção picker
    convex: [convex/groups.ts]
    paths:
      - src/components/settings/sections-manager.tsx
      - convex/lib/sections.ts
    personas: [admin]
    specs:
      - tests/e2e/mutating/m21-secoes.spec.ts
    adjacent: [escotista-painel, admin-members, settings-group]
    check: |
      PR preview only — seed has no seções (m21 creates/removes its own).
      Create: admin → Mais → Ajustes (/settings) → "Seções" section → "Nova
      seção" name + "Ramo da nova seção" = Escoteiro → "Adicionar"; rename
      inline → "Salvar". Place (on /escotista/admin, NOT Ajustes): Mais →
      Admin → João Mendes (9921010, m21-owned) row → tree icon "Editar ramo e
      seção do escoteiro" → "Seção" select (only seções of the escoteiro's
      ramo). Observe: Painel → green group card "Seção" select (only rendered
      once a seção exists) → pick it → only that seção's escoteiros plus
      unplaced ones (badge "sem seção") show. Clean up: select "Todas as
      seções", Admin → Seção "Sem seção", Ajustes → trash "Remover <nome>" →
      confirm "Remover".

  - id: guided-tour
    name: Tour guiado
    routes:
      /settings: src/routes/settings.tsx
    convex: [convex/users.ts]
    paths:
      - src/components/tour/**
    personas: [escoteiro-approved, escotista]
    specs:
      - tests/e2e/mutating/m23-guided-tour.spec.ts
    adjacent: [settings-group, escoteiro-progression, escotista-painel]
    check: |
      Escoteiro 9900005 → Perfil → "Tutorial" → "Ver tutorial" → jumps to /
      ("Passo 1 de N", "Vamos lá" → "Próximo" … "Concluir"); steps highlight
      tab bar targets. Escotista 9900002 → Mais → Ajustes → "Ver tutorial" →
      jumps to /escotista, highlights group card / bottom nav; "Pular" or Esc
      closes. Closed → doesn't reopen on reload (seed pre-stamps tourSeenAt,
      so it never auto-opens).

  - id: not-found
    name: Página não encontrada (404 de qualquer URL desconhecida)
    routes: {} # router-wide: defaultNotFoundComponent in src/router.tsx
    convex: []
    paths:
      - src/components/not-found.tsx
    personas: [escoteiro-with-progression, admin]
    specs:
      - tests/e2e/readonly/r8-not-found.spec.ts
    adjacent: [auth-signin, escoteiro-progression, escotista-painel]
    check: |
      Signed out → /nao-existe shows "Página não encontrada" (pt-BR, no bare
      "Not Found") → "Voltar ao início" → /signin. 9900006 → /pagina/x → 404
      → link → Progressão home. Admin → /escotista/nao-existe → 404 → link →
      painel. (An escoteiro under /escotista/* is sent home by the role guard
      first — expected.)
