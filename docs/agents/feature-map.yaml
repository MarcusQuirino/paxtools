      - tests/e2e/mutating/m08-older-etapa-report.spec.ts
      - tests/e2e/mutating/m22-plan-especialidade.spec.ts
    adjacent: [approvals-queue, plan, escotista-especialidades, ramo-advancement]
    check: |
      Younger: Kaique Neves (sim-troop-lobinho-11, 9911011) → /especialidades
      lists catalog; search (`?q=`) and the "Minhas" chip (`?f=minhas`); open
      one, check an item → pending (PR preview). Older: Rafael Bastos
