      - src/components/escotista/revisao-rapida-link.tsx
    personas: [escoteiro-with-progression]
    specs:
      - tests/e2e/mutating-mobile/m24-revisao-rapida.mobile.spec.ts
    adjacent: [escoteiro-progression, plan, approvals-queue]
    check: |
      Mobile viewport. 9900006 → home yellow "Revisão rápida" card → swipe
      screen shows cards (read only). Mutate on a PR preview as m24's Lara
      Fontes (9911012): the four icon buttons (aria-labels "Já fiz (→)",
