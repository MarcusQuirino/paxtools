      - tests/e2e/mutating/m16-ai-smoke.spec.ts
    adjacent: [plan, escotista-painel]
    check: |
      Admin → Mais → Stats: coverage bars, stage distribution, planos da
      tropa, especialidades summary render with numbers; switch ramo (admin
      gets all four tabs, defaults to Lobinho). Single-ramo escotista (Marina
      9912001) gets a plain "Lobinho" heading, no switcher. The AI card is
      flag-gated and off on previews (expected).

