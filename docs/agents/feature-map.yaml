# Paxtools feature map — what a change can break, and how to check it.
#
# Read by agents (docs/agents/verify.md) and by `bun scripts/verify.ts
# affected`, which maps a diff to features. `scripts/lib/feature-map.test.ts`
# (part of `bun test` → the required `Lint, Test, Build` check) FAILS when a
# route file in src/routes/ or a module in convex/*.ts is in no feature and
# not in `infra`, or when a listed path/spec/persona doesn't exist.
#
# Fields per feature:
#   id        stable kebab-case id (used in PR Verification sections)
#   name      human name (pt-BR UI terms as the app shows them)
#   routes    URL paths → route files (src/routes/…)
#   convex    convex/<module>.ts files this feature calls (top-level modules)
#   paths     other source globs that belong to it (components, hooks, lib)
#   personas  slugs from tests/utils/personas.ts (sign in with their registro;
#             password = the deployment's TEST_AUTH_PASSWORD)
#   specs     e2e specs covering it (tests/e2e/…); [] = no e2e coverage
#   adjacent  feature ids that share state/UI with it — drive one of these too
#   check     manual recipe on the running app: steps → what proves it works
#
# Personas marked "owned" in tests/utils/personas.ts belong to a mutating
# spec; mutate them on a PR preview only (CI reseeds it), never on staging.

infra:
  # Files that are not a user-facing feature on their own. Changes here hit
  # everything → `affected` returns the `core-smoke` feature set.
  shared:
    - src/routes/__root.tsx # app shell, head, toasts, tour provider mount
    - convex/schema.ts # every table
    - convex/users.ts # viewer query used by every guard
    - convex/auth.ts # Convex Auth providers (Google + managed registro)
    - src/hooks/use-auth-gate.ts
    - src/router.tsx
    - src/ssr.tsx
    - src/entry-client.tsx
    - src/components/ui/**
    - src/lib/**
    - src/data/**
    - convex/lib/authHelpers.ts
    - convex/lib/ramoVisibility.ts
    - convex/lib/progression.ts
    - convex/lib/especialidades.ts
    - convex/lib/sections.ts
    - styles/**
  # Not user-facing; no browser verification needed (unit tests cover them).
  none:
    - convex/auth.config.ts # auth provider wiring
    - convex/convex.config.ts # component registration
    - convex/migrations.ts # data migrations (verify via check:migrations + unit tests)
    - convex/testing.ts # test-persona seed/wipe, never on prod
    - src/routeTree.gen.ts # generated
  core-smoke: [auth-signin, escoteiro-progression, escotista-painel, approvals-queue]

features:
  - id: auth-signin
    name: Entrar (registro + senha) / guards / Crie sua senha
    routes:
      /signin: src/routes/signin.tsx
      /trocar-senha: src/routes/trocar-senha.tsx
    convex: [convex/auth.ts, convex/http.ts, convex/users.ts, convex/managedAccounts.ts]
    paths:
      - src/components/auth/**
      - src/hooks/use-auth-gate.ts
      - src/components/footer.tsx
      - convex/lib/testAccounts.ts
      - convex/lib/legacyTestRegistro.ts
      - convex/lib/managedAccounts.ts
    personas: [escoteiro-with-progression, admin, escotista-pending, escoteiro-pending, banned-user, escoteiro-onboarding-incomplete]
    specs:
      - tests/e2e/readonly/smoke.spec.ts
      - tests/e2e/readonly/r1-auth-guards.spec.ts
      - tests/e2e/readonly/r1-pending-routing.spec.ts
    adjacent: [onboarding, escoteiro-progression, escotista-painel]
    check: |
      Open / signed out → lands on /signin (heading "Bem-vindo de volta",
      CSS-uppercased). Wrong password → "Registro ou senha incorretos". Sign in
      9900006 → escoteiro home; sign out (Perfil → "Sair da conta"); sign in
      9900001 → /escotista painel; 9900003 (pending escotista) → "Aguardando
      aprovação", no bottom nav; 9900004 (pending escoteiro) → their own
      dashboard, NOT parked; 9900008 → /onboarding; 9900010 (banned) → stuck on
      the loading skeleton, no dashboard/painel. /trocar-senha only shows for a
      member with a temporary password (issue one with the key icon "Gerar
      nova senha", see managed-accounts) — no e2e covers it.

  - id: onboarding
    name: Onboarding (papel, ramo, criar/entrar no grupo)
    routes:
      /onboarding: src/routes/onboarding.tsx
    convex: [convex/onboarding.ts, convex/groups.ts]
    paths:
      - src/components/onboarding/**
    personas: [escoteiro-onboarding-incomplete, onboarding-m13]
    specs:
      - tests/e2e/mutating/m13-onboarding.spec.ts
      - tests/e2e/readonly/r1-auth-guards.spec.ts
    adjacent: [auth-signin, settings-group]
    check: |
      Sign in 9900008 → redirected to /onboarding ("Bem-vindo ao Paxtools"),
      papel step. Read only: picking a papel and "Continuar" on ramo each SAVE
      to the user (resume-on-reload), so don't click through on a shared
      backend. Full flow on a PR preview with onboarding-m13 (9900009, owned by
      m13, reset via testing:resetOnboardingUser): Escoteiro → pick ramo →
      "Continuar" → group code TESTQA → "Entrar no grupo" → lands on / (the
      escoteiro home; membership pending, shows on Admin "Solicitações
      pendentes").

