# PR merge gate: the full Playwright suite against the PR's OWN backend.
#
# Each PR branch has its own Convex preview deployment (named after the
# branch — the same one its Vercel preview build deploys to; see
# docs/deploy.md "PR previews"). This job pushes the branch's convex/ there,
# builds the frontend against it (node-server preset), serves it on the runner
# and runs the suite. Global setup wipes + reseeds that deployment, so runs
# never touch staging or another PR's data.
#
# Why a runner-local frontend instead of the Vercel preview URL: no polling
# for Vercel, no dependency on Vercel build/queue time, no cold-start
# serverless latency — the backend is the real isolated Convex deployment,
# which is what the gate is about. Agents drive the Vercel preview by hand.
#
# Why no sharding: shards would share the PR's one preview deployment and
# each reseed it in global setup, and the readonly → mutating phase ordering
# spans all specs. The suite runs in ~5 min on one 4-vCPU runner.
#
# Required status check on master (ruleset 27609274): "E2E (Playwright)".
# Rename the job → update the ruleset too.
#
# The preview deploy key can only create/update PREVIEW deployments, never
# staging or prod; scripts/lib/preview-deploy.ts also refuses any other key.
# Fork PRs get no secrets, so this check fails for them — push the branch to
# origin to gate it.
name: E2E

on:
  pull_request:
    branches: [master]

# One run per branch: they all share the branch's preview deployment.
concurrency:
  group: e2e-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      # Must equal TEST_AUTH_PASSWORD in the Convex preview default env vars
      # (the seed hashes that one).
      TEST_AUTH_PASSWORD: ${{ secrets.TEST_AUTH_PASSWORD }}
      E2E_PREVIEW_NAME: ${{ github.head_ref }}
      TEST_AUTH: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Require secrets
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ] || [ -z "$TEST_AUTH_PASSWORD" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY / TEST_AUTH_PASSWORD secrets unavailable (fork PR?). Push the branch to origin to run the e2e gate."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # Same two commands as a local preview run (docs/agents/e2e.md).
      - name: Deploy branch backend to its Convex preview + build frontend
        run: bun run e2e:deploy-preview

      - name: Run e2e suite
        run: bun run test:e2e:preview

      - name: Upload traces, screenshots, videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: playwright-report/
          retention-days: 14
