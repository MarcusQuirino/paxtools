# Independent review gate: a fresh Claude Code session (no shared context with
# the PR's author) reviews every PR against its stated intent, using the rubric
# in docs/agents/review-rubric.md. The job name `Independent review` is a
# required status check on master (ruleset 27609274) — rename it → update the
# ruleset. Flow, threat model and gaps: docs/agents/review-gate.md.
#
# SECURITY — this is `pull_request_target`, deliberately:
#   * the workflow, the rubric and scripts/review-gate.ts come from the BASE
#     branch (master), so a PR can't edit its own reviewer or rubric;
#   * it has secrets, so it must NEVER run code from the PR: the PR head is
#     checked out as plain files (no install, no scripts, no build) and the
#     reviewer only gets Read/Grep/Glob, with no GitHub token and no network
#     tools.
# No path filters / no `if:` on the job: a skipped job counts as a passing
# check. Forks and drafts fail fast instead.
name: Independent review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR at a time; a new push cancels the stale review.
concurrency:
  group: independent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky verdict comment
  issues: read # linked issues
  checks: read # CI results for the reviewer

jobs:
  review:
    name: Independent review
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      WORKDIR: ${{ github.workspace }}/review
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse fork and draft PRs
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Fork PRs aren't auto-reviewed (secrets + subscription). Marcus: push the branch to $REPO and reopen from there."
            exit 1
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "::error::Draft PR — the review runs when it's marked ready for review."
            exit 1
          fi

      # Trusted: base branch (master) — workflow logic, rubric, conventions.
      - name: Checkout base (trusted)
        uses: actions/checkout@v7
        with:
          path: trusted
          persist-credentials: false

      # Untrusted: PR head as plain files for the reviewer to read. Full history
      # for the merge base. Nothing in here is ever executed.
      - name: Checkout PR head (read-only, never executed)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review/pr
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Gather PR context (title, body, issues, diff, CI)
        run: bun trusted/scripts/review-gate.ts context

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.328

      # Fresh session, subscription auth. --safe-mode: no CLAUDE.md/hooks/MCP/
      # skills/settings from any directory (the PR's .claude/ can't run code).
      # Only read tools. `env -i`: the reviewer process sees no GitHub token.
      - name: Review
        working-directory: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          start=$(date +%s)
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/claude-home" \
            CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            timeout 25m claude -p \
              "Review PR #$PR_NUMBER (head $HEAD_SHA) following your instructions. Start with context/pr.md, then context/files.txt and context/pr.diff." \
              --safe-mode --strict-mcp-config \
              --tools "Read,Grep,Glob" --allowedTools "Read,Grep,Glob" \
              --permission-mode dontAsk \
              --model opus --effort high \
              --no-session-persistence \
              --append-system-prompt "$(cat ../trusted/docs/agents/review-rubric.md)" \
              --json-schema "$(bun ../trusted/scripts/review-gate.ts schema)" \
              --output-format json > "$RUNNER_TEMP/claude-output.json" 2> "$RUNNER_TEMP/claude-stderr.log"
          echo "claude exit $? after $(( $(date +%s) - start ))s"
          tail -n 50 "$RUNNER_TEMP/claude-stderr.log"
          exit 0

      - name: Verdict (comment + pass/fail)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bun trusted/scripts/review-gate.ts finalize "$RUNNER_TEMP/claude-output.json"
