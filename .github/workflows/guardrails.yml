# Guardrails: the repo rules agents are told to follow (CLAUDE.md), enforced.
# Every job is a required status check on master (ruleset 27609274) — rename a
# job → update the ruleset too. What each check does and how to satisfy it:
# docs/agents/ci-checks.md. Every check runs locally with the same command.
#
# No path filters on purpose: a required check that doesn't run blocks the
# merge forever. The jobs run in parallel with ci.yml / e2e.yml and are all
# shorter than e2e, so they add ~no wall-clock to a PR.
name: Guardrails

on:
  pull_request:
    branches: [master]
    # ready_for_review: its completion triggers the independent review
    # (review.yml, workflow_run), which refuses drafts.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_REF: origin/${{ github.base_ref }}

jobs:
  changeset:
    name: Changeset
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # merge-base with the base branch

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # No `bun install`: the checker only uses node builtins + git.
      - name: Changeset required for shipped code
        run: bun run check:changeset

  migration-registry:
    name: Migration registry append-only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: REGISTRY only appended vs base branch
        run: bun run check:migrations

  codegen:
    name: Convex codegen in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The anonymous local Convex backend binary (~200 MB), keyed by lockfile
      # so a convex upgrade fetches the matching backend.
      - name: Cache Convex local backend
        uses: actions/cache@v6
        with:
          path: ~/.cache/convex
          key: ${{ runner.os }}-convex-backend-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-convex-backend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Throwaway anonymous local backend: no secrets, no cloud deployment.
      - name: Regenerate convex/_generated and diff
        run: bun run check:codegen

  coverage:
    name: Coverage floor (convex/)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests with coverage + convex/ floor
        run: bun run test:coverage
